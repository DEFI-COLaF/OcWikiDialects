run_name: "finetune_ocmbert_prep"
version: "v1"
seed: 1
pretrained_name: "zhopto3/oc_mbert"

out_folder: "models/"

data_prep:
  lowercase: true
  strip_accents: "ascii"
  remove_punctuation: true
  norm_dup_chars: true
  mask_urls: "remove"
  mask_emails: "remove"
  mask_numbers: "remove"
  stopwords_list: null

training_args:
  learning_rate: 0.00001
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 16
  gradient_accumulation_steps: 4
  dataloader_num_workers: 16
  num_train_epochs: 50
  optim: "adamw_torch"
  lr_scheduler_type: "linear"
  warmup_ratio: 0.002
  report_to: "tensorboard"

early_stopping:
  early_stopping_patience: 10
